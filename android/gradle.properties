org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# ---- AdMob (release builds only; debug builds always use Google's TEST IDs) ----
# Paste your real IDs from admob.google.com. A release build refuses to compile
# while any of these is empty, so test ads can never ship by accident.
ADMOB_APP_ID=ca-app-pub-5423030594841423~2728753965
ADMOB_REWARDED_ID=ca-app-pub-5423030594841423/1657933619
ADMOB_INTERSTITIAL_ID=ca-app-pub-5423030594841423/8827258450
# true = every ad request is tagged child-directed (COPPA/Families) with
# G-rated, non-personalised ads and no GDPR consent form. Required while the
# Play Console target audience includes under-13s. Set false only if you
# change the target audience to 13+.
ADMOB_CHILD_DIRECTED=true
